<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SingaporeEx MRT</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap');
:root{
  --bg:#0a0c12;--surface:#12151f;--border:#1e2535;
  --text:#dde2f0;--muted:#5a6282;--ocean:#080f1a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace}

/* ── HEADER ── */
header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:52px;padding:0 16px;
  display:flex;align-items:center;justify-content:space-between;
  background:var(--surface);border-bottom:1px solid var(--border);
}
h1{font-family:'Syne',sans-serif;font-size:1.05rem;font-weight:800;color:#fff;letter-spacing:-0.5px}
.hbtns{display:flex;gap:8px}
.btn{
  background:none;border:1px solid var(--border);color:var(--text);
  padding:7px 12px;border-radius:8px;font-family:'JetBrains Mono',monospace;
  font-size:.72rem;cursor:pointer;transition:background .12s;white-space:nowrap;
  min-height:36px;
}
.btn:active{background:var(--border)}
.btn.danger{border-color:#3a1818;color:#f87171}
.btn.danger:active{background:#3a1818}

/* ── MAP ── */
#mapwrap{
  position:fixed;top:52px;left:0;right:0;bottom:0;
  overflow:hidden;background:var(--ocean);
  touch-action:none;
}
#mapsvg{position:absolute;top:0;left:0;width:100%;height:100%}
.station{cursor:pointer}

/* ── ZOOM BUTTONS ── */
.zc{position:absolute;right:14px;bottom:100px;display:flex;flex-direction:column;gap:6px;z-index:10}
.zbtn{
  width:46px;height:46px;background:var(--surface);border:1px solid var(--border);
  color:var(--text);border-radius:10px;font-size:1.4rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.zbtn:active{background:var(--border)}

/* ── BOTTOM SHEET ── */
#sheet{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:var(--surface);border-top:1px solid var(--border);
  border-radius:18px 18px 0 0;
  transform:translateY(calc(100% - 60px));
  transition:transform .3s cubic-bezier(.4,0,.2,1);
  max-height:80vh;overflow:hidden;
}
#sheet.open{transform:translateY(0)}
#sheet-handle{
  height:60px;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;cursor:pointer;flex-shrink:0;
}
.handle-bar{width:36px;height:4px;background:var(--border);border-radius:2px;position:absolute;left:50%;transform:translateX(-50%);top:10px}
.sheet-title{font-family:'Syne',sans-serif;font-size:.9rem;font-weight:700;color:#fff}
.sheet-stats{font-size:.72rem;color:var(--muted)}
#sheet-body{overflow-y:auto;padding:0 16px 32px;max-height:calc(80vh - 60px)}

/* ── LEVEL LEGEND ── */
.sec-title{font-size:.58rem;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin:14px 0 8px;font-family:'Syne',sans-serif;font-weight:700}
.lrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #1a1e2a}
.ldot{width:13px;height:13px;border-radius:50%;flex-shrink:0;border:2.5px solid #ffffff22}
.llabel{flex:1;font-size:.75rem;line-height:1.3}
.llabel small{color:var(--muted);font-size:.62rem;display:block}
.lcnt{color:var(--muted);font-size:.75rem;min-width:24px;text-align:right}

/* ── STATS ── */
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:8px 0 16px}
.stat-box{background:#0d1018;border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
.stat-val{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:800;color:#fff}
.stat-lbl{font-size:.58rem;color:var(--muted);margin-top:2px}

/* ── TOAST ── */
#toast{
  position:fixed;top:64px;left:50%;transform:translateX(-50%);
  background:#1a5c3a;color:#34d399;padding:8px 18px;border-radius:20px;
  font-size:.75rem;opacity:0;transition:opacity .2s;z-index:300;pointer-events:none;
  white-space:nowrap;
}
#toast.show{opacity:1}

/* ── STATION POPUP ── */
#popup{
  position:fixed;z-index:250;
  background:#12151fee;border:1px solid var(--border);
  padding:10px 14px;border-radius:10px;
  pointer-events:none;opacity:0;transition:opacity .15s;
  min-width:140px;max-width:200px;
}
#popup.show{opacity:1}
#pop-name{font-family:'Syne',sans-serif;font-weight:700;font-size:.88rem;margin-bottom:3px}
#pop-lines{color:var(--muted);font-size:.62rem;margin-bottom:4px}
#pop-level{font-size:.72rem}
</style>
</head>

<header>
  <h1>🚇 SingaporeEx MRT</h1>
  <div class="hbtns">
    <button class="btn" onclick="copyURL()">🔗 Share</button>

  </div>
</header>

  </svg>
  <div class="zc">

    <button class="zbtn" onclick="doZoom(0.77)">−</button>
    <button class="zbtn" onclick="resetView()">⌂</button>

</div>

    <div class="lrow"><div class="ldot" style="background:#5c4a1a;border-color:#fbbf24"></div><div class="llabel">4 — 宿泊<small>Stayed nearby</small></div><div class="lcnt" id="c4">0</div></div>

  </div>
</div>

<div id="toast"></div>
<div id="popup"><div id="pop-name"></div><div id="pop-lines"></div><div id="pop-level"></div></div>

const INTERCHANGES={
  "Jurong East":["EW","NS","JRL"],"Bugis":["EW","DT"],"City Hall":["EW","NS"],
  "Raffles Place":["EW","NS"],"Outram Park":["EW","NE","TE"],"Paya Lebar":["EW","CC"],
  "Dhoby Ghaut":["NS","NE","CC"],"HarbourFront":["NE","CC"],"Serangoon":["NE","CC"],
  "Bishan":["NS","CC"],"Botanic Gardens":["CC","DT"],"Buona Vista":["EW","CC"],
  "Newton":["NS","DT"],"Little India":["NE","DT"],"MacPherson":["CC","DT"],
  "Promenade":["CC","DT"],"Chinatown":["NE","DT"],"Bayfront":["CC","DT"],
  "Caldecott":["CC","TE"],"Stevens":["DT","TE"],"Orchard":["NS","TE"],
  "Marina Bay":["NS","TE"],"Bukit Panjang":["DT","BP"],"Sengkang":["NE","SK"],
  "Punggol":["NE","PG"],"Woodlands":["NS","TE"],"Tampines":["EW","DT"],
  "Choa Chu Kang":["NS","JRL"],
};

const seenNames={};const STATIONS=[];
RAW.forEach(r=>{
  if(!seenNames[r.n]){seenNames[r.n]=1;STATIONS.push({...r,lines:INTERCHANGES[r.n]||[r.line]});}
});

const LVL_RING=["","#a78bfa","#60a5fa","#34d399","#fbbf24","#fb923c","#f87171"];
const LVL_FILL=["","#2d1a5c","#1a3a5c","#1a5c3a","#5c4a1a","#5c2e10","#5c1a1a"];
const LVL_LBL=["未訪問","通過","乗り換え","目的のある訪問","宿泊","居住"];

const levels={};STATIONS.forEach(s=>levels[s.id]=0);

let vx=0,vy=0,vw=800,vh=580;
const LON0=103.60,LON1=104.02,LAT0=1.20,LAT1=1.47;
function prj(lon,lat){return[vx+(lon-LON0)/(LON1-LON0)*vw,vy+(1-(lat-LAT0)/(LAT1-LAT0))*vh];}

const gT=document.getElementById('gtracks');
const gR=document.getElementById('grings');
const gD=document.getElementById('gdots');
const gL=document.getElementById('glabels');

const TRACK_ORDER={
  EW:["EW1","EW2","EW3","EW4","EW5","EW6","EW7","EW8","EW9","EW10","EW11","EW12","EW13","EW14","EW15","EW16","EW17","EW18","EW19","EW20","EW21","EW22","EW23","EW24","EW25","EW26","EW27","EW28","EW29","EW30","EW31","EW32","EW33"],
  NS:["NS2","NS3","NS4","NS5","NS7","NS8","NS9","NS10","NS11","NS12","NS13","NS14","NS15","NS16","NS17","NS18","NS19","NS20","NS21","NS22","NS23","NS24","NS25","NS26","NS27","NS28"],
  NE:["NE1","NE3","NE4","NE5","NE6","NE7","NE8","NE9","NE10","NE11","NE12","NE13","NE14","NE15","NE16","NE17"],
  CC:["CC29","CC28","CC27","CC26","CC25","CC24","CC23","CC22","CC21","CC20","CC19","CC17","CC16","CC15","CC14","CC13","CC12","CC11","CC10","CC9","CC8","CC7","CC6","CC5","CC4","CC3","CC2","CC1","CC34"],
  DT:["DT1","DT2","DT3","DT5","DT6","DT7","DT8","DT9","DT10","DT11","DT12","DT13","DT14","DT15","DT16","DT17","DT18","DT19","DT20","DT21","DT22","DT23","DT24","DT25","DT26","DT27","DT28","DT29","DT30","DT31","DT32","DT33","DT34","DT35"],
  TE:["TE1","TE2","TE3","TE4","TE5","TE6","TE7","TE8","TE9","TE11","TE12","TE13","TE14","TE15","TE16","TE17","TE18","TE19","TE20","TE22","TE23","TE24","TE25","TE26","TE27","TE28","TE29"],
  BP:["BP6","BP7","BP8","BP9","BP10","BP11","BP12","BP13","BP14"],
  SK:["STC","SE1","SE2","SE3","SE4","SE5","SW8","SW7","SW6","SW5","SW4","SW3","SW2","SW1"],
  PG:["PTC","PE1","PE2","PE3","PE4","PE5","PE6","PE7","PW1","PW2","PW3","PW4","PW5","PW6","PW7"],
  JRL:["JS1","JS2","JS3","JS4","JS5","JS6","JS7","JW1","JW2","JW3","JW4","JW5","JE0","JE1","JE2"],
  SX:["SX1","SX2","SX3","SX4"],
};
const rawById={};RAW.forEach(r=>rawById[r.id]=r);

function buildTracks(){
  gT.innerHTML='';
  Object.entries(TRACK_ORDER).forEach(([line,ids])=>{
    const pts=ids.map(id=>rawById[id]?prj(rawById[id].lon,rawById[id].lat).join(','):null).filter(Boolean);
    if(pts.length<2)return;
    const pl=document.createElementNS('http://www.w3.org/2000/svg','polyline');
    pl.setAttribute('points',pts.join(' '));
    pl.setAttribute('stroke','#3a4258');
    pl.setAttribute('stroke-width',line==='SX'?'2':'3');
    pl.setAttribute('fill','none');
    pl.setAttribute('stroke-linecap','round');
    pl.setAttribute('stroke-linejoin','round');
    pl.setAttribute('opacity',line==='JRL'?'0.4':'0.55');
    if(line==='JRL')pl.setAttribute('stroke-dasharray','6 4');
    gT.appendChild(pl);
  });
}

const dotEls={},ringEls={},lblEls={};

function getBaseFill(s){return s.lines.length>1?'#c8ccd8':'#5a6282';}

function buildStations(){
  gR.innerHTML='';gD.innerHTML='';gL.innerHTML='';
  STATIONS.forEach(s=>{
    const[x,y]=prj(s.lon,s.lat);
    const ic=s.lines.length>1;
    const isLRT=['BP','SK','PG'].includes(s.lines[0])&&s.lines.length===1;
    const r=ic?11:isLRT?7:9;

    // ring
    const ring=document.createElementNS('http://www.w3.org/2000/svg','circle');
    ring.setAttribute('cx',x);ring.setAttribute('cy',y);ring.setAttribute('r',r+6);
    ring.setAttribute('stroke',LVL_RING[levels[s.id]]||'none');
    ring.setAttribute('fill','none');ring.setAttribute('stroke-width','3');
    ring.setAttribute('opacity',levels[s.id]?'1':'0');
    gR.appendChild(ring);ringEls[s.id]=ring;

    // hit area
    const hit=document.createElementNS('http://www.w3.org/2000/svg','circle');
    hit.setAttribute('cx',x);hit.setAttribute('cy',y);hit.setAttribute('r',r+14);
    hit.setAttribute('fill','transparent');
    gD.appendChild(hit);

    // dot
    const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
    dot.setAttribute('cx',x);dot.setAttribute('cy',y);dot.setAttribute('r',r);
    dot.setAttribute('fill',getBaseFill(s));
    dot.setAttribute('stroke','#080f1a');dot.setAttribute('stroke-width',ic?'2':'1.5');
    if(s.lines[0]==='JRL')dot.setAttribute('fill-opacity','0.55');
    gD.appendChild(dot);dotEls[s.id]=dot;

    // label
    const lbl=document.createElementNS('http://www.w3.org/2000/svg','text');
    lbl.setAttribute('x',x+r+5);lbl.setAttribute('y',y);
    lbl.setAttribute('font-size','8');lbl.setAttribute('fill','#ffffffaa');
    lbl.setAttribute('dominant-baseline','middle');
    lbl.setAttribute('font-family','JetBrains Mono,monospace');
    lbl.setAttribute('pointer-events','none');
    lbl.textContent=s.n;
    gL.appendChild(lbl);lblEls[s.id]=lbl;

    // tap handler
    [hit,dot].forEach(el=>{
      el.addEventListener('click',e=>{
        e.stopPropagation();
        if(wasDragging)return;
        const nxt=(levels[s.id]+1)%6;
        setLv(s.id,nxt);updateURL();updateStats();
        showPopup(s,x,y);
      });
    });
  });
}

function showPopup(s,x,y){
  const pop=document.getElementById('popup');
  document.getElementById('pop-name').textContent=s.n;
  document.getElementById('pop-lines').textContent=s.lines.join(' · ');
  const lv=levels[s.id];
  document.getElementById('pop-level').textContent=`Level ${lv} — ${LVL_LBL[lv]}`;
  pop.style.left=Math.min(x+20,window.innerWidth-160)+'px';
  pop.style.top=Math.max(y-40,60)+'px';
  pop.classList.add('show');
  clearTimeout(pop._t);pop._t=setTimeout(()=>pop.classList.remove('show'),1800);
}

function setLv(id,lv){
  levels[id]=lv;
  const ring=ringEls[id];const dot=dotEls[id];
  if(ring){ring.setAttribute('stroke',lv?LVL_RING[lv]:'none');ring.setAttribute('opacity',lv?'1':'0');}
  if(dot){
    if(lv>0){dot.setAttribute('fill',LVL_FILL[lv]);dot.setAttribute('stroke',LVL_RING[lv]);}
    else{const s=STATIONS.find(x=>x.id===id);dot.setAttribute('fill',getBaseFill(s));dot.setAttribute('stroke','#080f1a');}
  }
}

function updateStats(){
  const cnt=[0,0,0,0,0,0];
  STATIONS.forEach(s=>{cnt[levels[s.id]]++;});
  for(let i=0;i<6;i++){const el=document.getElementById('c'+i);if(el)el.textContent=cnt[i];}
  const vis=cnt[3]+cnt[4]+cnt[5];const tot=STATIONS.length;
  document.getElementById('stot').textContent=tot;
  document.getElementById('svis').textContent=vis;
  const pct=Math.round(vis/tot*100);
  document.getElementById('spct').textContent=pct+'%';
  document.getElementById('sheet-summary').textContent=`訪問済み ${vis}/${tot} (${pct}%)`;
}

function encodeState(){return STATIONS.map(s=>levels[s.id]).join('');}
function decodeState(h){
  const str=h.replace('#','');
  STATIONS.forEach((s,i)=>{const v=parseInt(str[i]||'0');levels[s.id]=isNaN(v)?0:Math.min(v,5);});
}
function updateURL(){history.replaceState(null,'','#'+encodeState());}
function resetAll(){STATIONS.forEach(s=>setLv(s.id,0));updateURL();updateStats();}
function copyURL(){
  navigator.clipboard.writeText(location.href).then(()=>{
    const t=document.getElementById('toast');
    t.textContent='✓ URLをコピーしました';t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2000);
  });
}

// ── Bottom sheet ──
let sheetOpen=false;
function toggleSheet(){
  sheetOpen=!sheetOpen;
  document.getElementById('sheet').classList.toggle('open',sheetOpen);
}

function rebuildPos(){
  buildTracks();
  STATIONS.forEach(s=>{
    const[x,y]=prj(s.lon,s.lat);
    const ic=s.lines.length>1;
    const isLRT=['BP','SK','PG'].includes(s.lines[0])&&s.lines.length===1;
    const r=ic?11:isLRT?7:9;
    if(dotEls[s.id]){dotEls[s.id].setAttribute('cx',x);dotEls[s.id].setAttribute('cy',y);}
    if(ringEls[s.id]){ringEls[s.id].setAttribute('cx',x);ringEls[s.id].setAttribute('cy',y);}
    if(lblEls[s.id]){lblEls[s.id].setAttribute('x',x+r+5);lblEls[s.id].setAttribute('y',y);}
    // update hit area too
  });
  // rebuild hit areas positions
  const hits=gD.querySelectorAll('circle:not([fill])');
}

// ── Touch / Pan / Pinch ──
const wrap=document.getElementById('mapwrap');
let drag=false,wasDragging=false,ds=null,vs=null;
let pinching=false,pinchD0=0,pinchMid=null,vxP=0,vyP=0,vwP=0,vhP=0;

function dist2(t){
  return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
}
function mid2(t){
  const r=wrap.getBoundingClientRect();
  return{x:(t[0].clientX+t[1].clientX)/2-r.left,y:(t[0].clientY+t[1].clientY)/2-r.top};
}

wrap.addEventListener('touchstart',e=>{
  if(e.touches.length===1){
    drag=true;wasDragging=false;
    ds={x:e.touches[0].clientX,y:e.touches[0].clientY};vs={x:vx,y:vy};
  } else if(e.touches.length===2){
    drag=false;pinching=true;
    pinchD0=dist2(e.touches);pinchMid=mid2(e.touches);
    vxP=vx;vyP=vy;vwP=vw;vhP=vh;
  }
},{passive:true});

wrap.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1&&drag){
    const dx=e.touches[0].clientX-ds.x;
    const dy=e.touches[0].clientY-ds.y;
    if(Math.abs(dx)>4||Math.abs(dy)>4)wasDragging=true;
    vx=vs.x+dx;vy=vs.y+dy;rebuildPos();
  } else if(e.touches.length===2&&pinching){
    const d=dist2(e.touches);
    const f=d/pinchD0;
    const m=mid2(e.touches);
    vw=vwP*f;vh=vhP*f;
    vx=m.x-(pinchMid.x-vxP)*f;
    vy=m.y-(pinchMid.y-vyP)*f;
    rebuildPos();
  }
},{passive:false});

wrap.addEventListener('touchend',e=>{
  if(e.touches.length===0){drag=false;pinching=false;}
  if(e.touches.length===1&&pinching){
    pinching=false;drag=true;
    ds={x:e.touches[0].clientX,y:e.touches[0].clientY};vs={x:vx,y:vy};
  }
},{passive:true});

// Mouse support for desktop
wrap.addEventListener('mousedown',e=>{drag=true;wasDragging=false;ds={x:e.clientX,y:e.clientY};vs={x:vx,y:vy};});
window.addEventListener('mouseup',()=>{drag=false;});
window.addEventListener('mousemove',e=>{
  if(!drag)return;
  const dx=e.clientX-ds.x,dy=e.clientY-ds.y;
  if(Math.abs(dx)>3||Math.abs(dy)>3)wasDragging=true;
  vx=vs.x+dx;vy=vs.y+dy;rebuildPos();
});
wrap.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=e.deltaY<0?1.15:0.87;
  const r=wrap.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  vx=mx-f*(mx-vx);vy=my-f*(my-vy);vw*=f;vh*=f;rebuildPos();
},{passive:false});

function doZoom(f){
  const r=wrap.getBoundingClientRect();
  const cx=r.width/2,cy=r.height/2;
  vx=cx-f*(cx-vx);vy=cy-f*(cy-vy);vw*=f;vh*=f;rebuildPos();
}
function resetView(){
  const r=wrap.getBoundingClientRect();
  vw=r.width*.95;vh=r.height*.95;vx=r.width*.025;vy=r.height*.025;rebuildPos();
}

// ── Init ──
if(location.hash&&location.hash.length>1)decodeState(location.hash);
const ir=wrap.getBoundingClientRect();
vw=ir.width*.95;vh=ir.height*.95;vx=ir.width*.025;vy=ir.height*.025;
buildTracks();buildStations();
if(location.hash&&location.hash.length>1)STATIONS.forEach(s=>setLv(s.id,levels[s.id]));
updateStats();
</script>
